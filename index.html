<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Scripts del proyecto -->
    <script defer src="js/productoManager.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="Logo de la empresa">
        <div>
            <h1>3DPrint Manager</h1>
            <p>Tu gestor de productos impresos en 3D</p>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2>Agregar Producto</h2>
            <input type="text" id="inputNombre" placeholder="Nombre del producto">
            <input type="number" id="inputPrecio" placeholder="Precio" min="0" step="1">
            <button id="btnAgregar">Agregar</button>
        </section>

        <section class="list-section">
            <h2>Lista de Productos</h2>
            <ul id="listaProductos">
                <!-- Aquí se insertarán los productos -->
            </ul>
        </section>
    </main>
</body>
</html>
