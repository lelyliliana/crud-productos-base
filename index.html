<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Cargar primero el módulo de almacenamiento -->
  <script defer src="js/storage.js"></script>
  <script defer src="js/productoManager.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Logo de la empresa">
    <div>
      <h1>3DPrint Manager</h1>
      <p>Tu gestor de productos impresos en 3D</p>
    </div>
  </header>

  <main>
    <section class="form-section">
      <h2>Agregar Producto</h2>
      <!-- Formulario completo con etiquetas y un ID de formulario -->
      <form id="formulario">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" required>
        <input type="number" id="precio" name="precio" placeholder="Precio" min="0" step="1" required>
        <input type="number" id="cantidad" name="cantidad" placeholder="Cantidad" min="1" step="1" required>
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section class="list-section">
      <h2>Lista de Productos</h2>
      <div id="lista">
        <!-- Aquí se insertarán los productos -->
      </div>
    </section>
  </main>
</body>
</html>
